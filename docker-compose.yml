services:
  postgres:
    image: postgres:16
    container_name: karobaros-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: karobaros
      POSTGRES_USER: karobaros
      POSTGRES_PASSWORD: karobaros_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karobaros -d karobaros"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
